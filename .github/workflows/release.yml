name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # 前置创建空 prerelease：三个平台 job 并行收尾时若 release 不存在会竞争 create，
  # 后到者 already_exists 失败（v0.1.1 实测）。统一由此 job 先建，构建 job 只追加上传。
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create empty prerelease
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true

  build-windows:
    name: Build & Publish Windows Release
    needs: prepare-release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: generated/devwit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: generated/devwit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore Electron binary
        shell: pwsh
        run: |
          $ver = (Get-Content node_modules/electron/package.json -Raw | ConvertFrom-Json).version
          $zip = "$env:TEMP\electron-v$ver-win32-x64.zip"
          curl.exe -sSL -o $zip "https://github.com/electron/electron/releases/download/v$ver/electron-v$ver-win32-x64.zip"
          if ($LASTEXITCODE -ne 0) { Write-Error "electron zip 下载失败"; exit 1 }
          Expand-Archive $zip -DestinationPath node_modules/electron/dist -Force
          [System.IO.File]::WriteAllText("$PWD\node_modules\electron\path.txt", "electron.exe")
          if (!(Test-Path node_modules/electron/dist/electron.exe)) { Write-Error "electron.exe 仍缺失"; exit 1 }
          Write-Host "electron $ver 二进制就绪"

      - name: Build NSIS installer + portable
        run: npm run dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            generated/devwit/release/*.exe
            generated/devwit/release/*.blockmap
            generated/devwit/release/*.yml
          generate_release_notes: true
          # 默认预发布：本地试用反馈确认后，在 Release 页面手动转正
          prerelease: true

  build-macos:
    name: Build & Publish macOS Release
    needs: prepare-release
    runs-on: macos-latest
    defaults:
      run:
        working-directory: generated/devwit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: generated/devwit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore Electron binary
        run: |
          set -euo pipefail
          ver=$(node -p "require('./node_modules/electron/package.json').version")
          machine=$(uname -m)
          if [ "$machine" = "arm64" ]; then earch="darwin-arm64"; else earch="darwin-x64"; fi
          curl -sSL -o /tmp/electron.zip "https://github.com/electron/electron/releases/download/v${ver}/electron-v${ver}-${earch}.zip"
          mkdir -p node_modules/electron/dist
          ditto -x -k /tmp/electron.zip node_modules/electron/dist
          printf 'Electron.app/Contents/MacOS/Electron' > node_modules/electron/path.txt
          test -x node_modules/electron/dist/Electron.app/Contents/MacOS/Electron
          echo "electron $ver ($earch) 二进制就绪"

      - name: Build dmg + zip
        run: npm run dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            generated/devwit/release/*.dmg
            generated/devwit/release/*.zip
            generated/devwit/release/*.blockmap
            generated/devwit/release/*.yml
          generate_release_notes: true
          prerelease: true

  build-linux:
    name: Build & Publish Linux Release
    needs: prepare-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: generated/devwit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: generated/devwit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore Electron binary
        run: |
          set -euo pipefail
          ver=$(node -p "require('./node_modules/electron/package.json').version")
          machine=$(uname -m)
          if [ "$machine" = "aarch64" ]; then earch="linux-arm64"; else earch="linux-x64"; fi
          curl -sSL -o /tmp/electron.zip "https://github.com/electron/electron/releases/download/v${ver}/electron-v${ver}-${earch}.zip"
          mkdir -p node_modules/electron/dist
          unzip -q -o /tmp/electron.zip -d node_modules/electron/dist
          printf 'electron' > node_modules/electron/path.txt
          test -x node_modules/electron/dist/electron
          echo "electron $ver ($earch) 二进制就绪"

      - name: Build AppImage + deb
        run: npm run dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            generated/devwit/release/*.AppImage
            generated/devwit/release/*.deb
            generated/devwit/release/*.blockmap
            generated/devwit/release/*.yml
          generate_release_notes: true
          prerelease: true
