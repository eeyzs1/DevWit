name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: generated/devwit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: generated/devwit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore Electron binary
        shell: pwsh
        run: |
          $ver = (Get-Content node_modules/electron/package.json -Raw | ConvertFrom-Json).version
          $zip = "$env:TEMP\electron-v$ver-win32-x64.zip"
          curl.exe -sSL -o $zip "https://github.com/electron/electron/releases/download/v$ver/electron-v$ver-win32-x64.zip"
          if ($LASTEXITCODE -ne 0) { Write-Error "electron zip 下载失败"; exit 1 }
          Expand-Archive $zip -DestinationPath node_modules/electron/dist -Force
          [System.IO.File]::WriteAllText("$PWD\node_modules\electron\path.txt", "electron.exe")
          if (!(Test-Path node_modules/electron/dist/electron.exe)) { Write-Error "electron.exe 仍缺失"; exit 1 }
          Write-Host "electron $ver 二进制就绪"

      - name: Build NSIS installer + portable
        run: npm run dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            generated/devwit/release/*.exe
            generated/devwit/release/*.blockmap
            generated/devwit/release/*.yml
          generate_release_notes: true
          # 默认预发布：本地试用反馈确认后，在 Release 页面手动转正
          prerelease: true
