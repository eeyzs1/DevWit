name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: generated/devwit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: generated/devwit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore Electron binary
        run: node node_modules/electron/install.js

      - name: Build NSIS installer + portable
        run: npm run dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            generated/devwit/release/*.exe
            generated/devwit/release/*.blockmap
          generate_release_notes: true
          # 默认预发布：本地试用反馈确认后，在 Release 页面手动转正
          prerelease: true
