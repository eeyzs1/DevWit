version: 1
required: [domain, findings]
properties:
  domain:
    type: string
    minLength: 1
  scale:
    type: string
    enum: [personal, team, organization, public]
  goal:
    type: string
  quality_attributes:
    type: array
    items: {type: string}
  acceptance_criteria:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  assumptions:
    type: array
    items: {type: string}
  resolved_unknowns:
    type: array
    items:
      type: string
      minLength: 1
  findings:
    type: array
    minItems: 1
    items:
      type: object
      required: [claim]
      properties:
        claim:
          type: string
          minLength: 1
        source_url:
          type: string
        assumption:
          type: boolean
      additionalProperties: false
  rationale:
    type: string
additionalProperties: false
