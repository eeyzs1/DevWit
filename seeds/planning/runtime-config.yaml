version: 1
description: |
  Supervisor runtime configuration.
  LLM 在 GENERATE 阶段从 task.yaml 派生：
    - max_items / max_runtime / error_threshold（从 complexity.scope / criticality）
    - stop_conditions（从 acceptance_criteria 数量 + criticality）
    - dispatch_mode（从 team_size）
    - claim_policy（从 task 优先级需求）
    - worktree_pool_size（从 scope + criticality）
    - branch_prefix / base_branch（从 architecture-rules）
    - push_after_rebase（从 team_size > 1 时为 true）

supervisor:
  enabled: true                     # false = 单 session 模式，不生成 supervisor
  max_items: 10                     # 单轮最多处理多少 workitem
  max_runtime_seconds: 3600         # 单轮最长运行时间
  error_threshold: 3                # 连续失败多少次 stop
  claim_policy: any                 # fifo / priority / critical / any

stop_conditions:
  - queue_empty                     # workitem source 无候选
  - max_items_reached               # 达到 max_items 上限
  - error_threshold                 # 连续失败次数超阈值
  - manual_stop                     # 检测到 .meta-harness/STOP 文件
  # - all_acs_verified              # 所有 AC 已验证完成（高 criticality 项目启用）
  # - fatal_event                   # 事件流出现 fatal 级事件（criticality >= 4 启用）
  # - max_runtime_exceeded          # 超时
  # - drain                         # graceful shutdown 模式

dispatch_mode: subprocess           # subprocess / mavis / ide-adapter
  # subprocess: spawn `python orchestrator.py --workitem-id <id>` 在 worktree 里
  # mavis/ide-adapter: LLM 在 GENERATE 合成具体 dispatcher impl

worktree:
  pool_size: 0                      # 预创建 worktree 池大小（0 = 不预创建）
  branch_prefix: feature            # 分支前缀
  base_branch: origin/main          # rebase 的 base
  push_after_rebase: false          # team_size > 1 时建议 true

traces_to:
  # 每条 stop condition 对应的 AC（LLM 填）
  # 例：all_acs_verified → [AC1, AC2, AC3]
