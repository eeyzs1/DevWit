      team_size 派生。scope<=2 时 supervisor.enabled=false。
- id: planning/workitem-source.yaml
  layer: planning
  kind: slot
  source: seeds/planning/workitem-source.yaml
  enabled: true
  config:
    baseline_hash: 49222f4c5ff9221f50f15385b84b8a4c
    guidance: 声明 workitem source adapter（adapter + class_name + config）。LLM 据 task.work_source
      决定用 yunxiao/github_issues/local_file/jira 等，并在 runtime/sources/<adapter>_source.py
      生成实现（继承 runtime/workitem_source.py 的 WorkitemSource 基类，实现 4 个抽象方法）。meta-harness
      不预设 adapter。
- id: planning/merge-policy.yaml
  layer: planning
  kind: slot
  source: seeds/planning/merge-policy.yaml
  enabled: true
  config:
    baseline_hash: f448f149d48ddb3c7a56d31419b00750
    guidance: 分支合并策略：rebase_only / rebase_preferred / merge_allowed / squash。从 criticality
      派生（C>=4 → rebase_only）。rebase-only 下不需要 merge sub-agent，冲突由 supervisor 标 blocked
      转人工。
- id: planning/agent-protocol.yaml
  layer: planning
  kind: slot
  source: seeds/planning/agent-protocol.yaml
  enabled: true
  config:
    baseline_hash: 931242824a65563e37a578eae123fb24
    guidance: leaf agent 协议配置：role 枚举（explorer/worker/tester/reviewer 等）+ 每 role 的
      gate / forbidden_side_effects / timeout / effort→budget 映射。从 sub-agent-dispatch.yaml
      的 prototypes 派生。被 runtime/leaf_prepare.py 读取。
- id: docs/harness-doc-contract.yaml
  layer: docs
