- id: planning/runtime-config.yaml
  layer: planning
  kind: slot
  source: seeds/planning/runtime-config.yaml
  enabled: true
  config:
    baseline_hash: c23f4bfad3a5deb4ffbd17dbe59897e4
    guidance: supervisor 运行时配置：max_items / stop_conditions / dispatch_mode / claim_policy
