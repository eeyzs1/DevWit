    guidance: harness 自身文档契约：README/AGENTS.md/CHANGELOG/DESIGN-DECISIONS 的 schema、生成时机、版本化策略。纳入
      evolution loop（genome 含 doc 演进约束，innovation 把'文档过时'作为创新提案）。
- id: docs/project-doc-contract.yaml
