- id: memory/compression-rules.yaml
  layer: memory
  kind: slot
  source: seeds/memory/compression-rules.yaml
  enabled: true
  config:
    baseline_hash: a6f0e0cde8e54bbf99c6c5f94fa3d719
    guidance: 按该项目该保留/压缩/遗忘的内容，写压缩规则。
- id: planning/flow-control.yaml
  layer: planning
  kind: slot
  source: seeds/planning/flow-control.yaml
  enabled: true
  config:
    baseline_hash: 6fa00cd1dbb11505cf60095bbac7980a
    guidance: 按该项目工作流（顺序/并行/条件/重试），写流控配置。
- id: planning/work-units.yaml
  layer: planning
  kind: slot
  source: seeds/planning/work-units.yaml
  enabled: true
  config:
    baseline_hash: d41d8cd98f00b204e9800998ecf8427e
    guidance: 把 task 分解为可独立派发的工作单元。每条含 id/name/depends_on/assigned_to/success_constraints/success_criteria。depends_on
      必须基于真实依赖（如下游用上游的产物）。assigned_to 必须引用 sub-agent-dispatch.yaml 里某个 prototype 名。dispatcher.py
      读本文件做拓扑排序与并行分组，不要在这里硬塞顺序——只声明依赖关系即可。
- id: planning/sub-agent-dispatch.yaml
  layer: planning
  kind: slot
  source: seeds/planning/sub-agent-dispatch.yaml
  enabled: true
  config:
    baseline_hash: c0fe8fd5fd962475d9f60db60bfdd1c4
    guidance: '分析 task 的工作单元与依赖，合成 agent 拓扑（不要套用固定公式 ceil(S/2)）。每个 prototype 必须含 responsibilities/receives/produces/count/boundaries.cannot/boundaries.max_context_lines。需人工
      review 的角色必须显式 requires_human_review: true。'
- id: planning/budget.yaml
  layer: planning
  kind: slot
  source: seeds/planning/budget.yaml
  enabled: true
  config:
    baseline_hash: fc355d7c7ccfa52021671952977e35da
    guidance: 按该项目复杂度与风险，设置 reasoning step/token/retry 预算。
- id: verification/security-guardrails.yaml
  layer: verification
  kind: slot
  source: seeds/verification/security-guardrails.yaml
  enabled: true
  config:
    baseline_hash: 1de64e996fd304b993b2a5a0afb0a5d9
    guidance: 分析 task 的数据流与敏感数据面，写 PII/secret 模式与危险操作拦截（针对该项目领域）。
- id: feedback/retry-config.yaml
  layer: feedback
  kind: slot
  source: seeds/feedback/retry-config.yaml
  enabled: true
  config:
    baseline_hash: 6d34e71a4c632f04eff1b9e981e0c5ba
    guidance: 按该项目可能的错误类型，写重试策略。
- id: feedback/fixer-registry.yaml
  layer: feedback
  kind: slot
  source: seeds/feedback/fixer-registry.yaml
  enabled: true
  config:
    baseline_hash: 1cb93686ac697f6c5b1fad8daf831e72
    guidance: 按该项目 retry-config 的 strategy，为可机械修复的错误类型绑定定向 fixer（match/handler/entry/safe）。通用
      ruff_autofix 条目保留，项目特定 fixer 据 task.yaml + work-units + retry-config 推演追加，并在
      feedback/fixers/ 生成实现。
