version: 1
description: >-
  Fixer registry — 把 retry-config 的 strategy 绑定到可执行 fixer。
  apply_fixes (verification/self-check.py) 加载本文件，按 fix['type'](=retry strategy)
  + fix['error_type'] 双键查 fixer，命中且 safe=true 则 importlib 动态调用 handler。
  通用 fixer (ruff_autofix) 由 scaffold 原样复制；项目特定 fixer 必须由 LLM 据
  task.yaml + work-units + retry-config 推演追加到本文件，并在 feedback/fixers/ 生成实现。

fixers:
  # 通用 fixer（scaffold 复制 ruff-fixer.py，所有项目共享，LLM 不改本条）
  ruff_autofix:
    match:
      strategy: [immediate_with_fix_hint]
      error_types: [syntax_error, import_error]
    handler: "feedback/fixers/ruff-fixer.py"
    entry: "fix"
    safe: true
    description: "ruff --fix 处理可机械修复的 lint/格式/unused import 问题"

  # ↓↓↓ DevWit 项目特定 fixer（据 feedback/retry-config.yaml 推演追加）↓↓↓
  # 推演结论：eslint_failure 与 lockfile_drift 可机械修复 → 绑定 safe=true 的定向
  # fixer；audit_write_failed 涉及审计哈希链完整性，修复需人工确认 → safe=false；
  # secret_leak_detected 为凭证泄露（违反 AR005），不绑任何 fixer，直接转人工。

  eslint_autofix:
    match:
      strategy: [auto_fix]
      error_types: [eslint_failure]
    handler: "feedback/fixers/eslint-autofixer.py"
    entry: "fix"
    safe: true
    description: "对报错文件跑 npx eslint --fix 机械修复可自动修复的 lint 问题（格式/未使用 import 等）"

  lockfile_repair:
    match:
      strategy: [auto_fix]
      error_types: [lockfile_drift]
    handler: "feedback/fixers/lockfile-repair.py"
    entry: "fix"
    safe: true
    description: "npm install --package-lock-only 重算 package-lock.json，修复 lockfile 与 package.json 漂移"

  audit_hash_repair:
    match:
      strategy: [no_retry]
      error_types: [audit_write_failed]
    handler: "feedback/fixers/audit-hash-repair.py"
    entry: "fix"
    safe: false
    description: "审计哈希链修复（重算/续链）需人工确认——仅输出操作步骤，不实际改审计日志"
