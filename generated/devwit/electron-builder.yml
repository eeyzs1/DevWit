appId: com.devwit.app
productName: DevWit
directories:
  app: .
  output: release
files:
  # 主进程/preload/渲染层均已 esbuild 打包进 apps/desktop/dist（含全部 @devwit/* 依赖），
  # node-pty 为可选原生依赖，缺失时自动回退 pipe 后端。
  # typescript-language-server + typescript（tsserver）为 LSP 代码智能运行时依赖（AC40），
  # 经 require.resolve 定位，必须随行；asarUnpack 保证 spawn 的子进程可读。
  # pyright（pyright-langserver.js）为 Python LSP 运行时依赖（v0.5.0 多语言），同口径。
  # vendor/js-debug（dapDebugServer.js）为 DAP 调试运行时依赖（AC42），同口径。
  - apps/desktop/dist/**
  - package.json
  - node_modules/typescript-language-server/lib/**
  - node_modules/typescript/lib/**
  - node_modules/pyright/dist/**
  - vendor/js-debug/**
asar: true
asarUnpack:
  - node_modules/typescript-language-server/**
  - node_modules/typescript/**
  - node_modules/pyright/**
  - vendor/js-debug/**
# 本机已装 Electron dist（与 devDependency 同版本），打包零下载，规避 GitHub 直连不可达。
electronDist: node_modules/electron/dist
win:
  target:
    - nsis
  # Azure Trusted Signing（P0 信任基建）：azureSignOptions 不落盘仓库，
  # 由 CI（release.yml，vars.AZURE_SIGN_ENABLED=true 门控）经 scripts/enable-azure-signing.mjs 注入；
  # 未启用时 electron-builder 找不到签名配置自动跳过签名，保持现状。
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# macOS（迭代 9）：dmg（用户安装）+ zip（electron-updater macOS 只认 zip）。
# 未配置签名身份时 electron-builder 自动跳过签名（开发分发）；
# macOS 自动更新要求签名包，未签名时 update 通道提示但不强升——手动下载 dmg 覆盖即可。
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
# Linux（迭代 12）：AppImage（electron-updater 在 Linux 唯一支持的自动更新格式）
# + deb（Debian/Ubuntu 系安装包，无自动更新——手动下载覆盖，与未签名 mac 同策略）。
linux:
  category: Development
  target:
    - AppImage
    - deb
npmRebuild: false
# 自动更新（AC16）：electron-updater 从 GitHub Releases 拉取 latest.yml 与安装包；
# 仅声明元数据，electron-builder 不主动发布（发布由 release.yml 的 action-gh-release 完成）。
publish:
  provider: github
  owner: eeyzs1
  repo: DevWit
