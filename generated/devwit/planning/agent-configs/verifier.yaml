agent:
  name: verifier
  role: 编写并运行 E2E 测试（启动应用/打开文件夹/编辑保存/对话/Agent/切换模型/模式热更新）; 运行 build 验证（npm run build
    全仓无错误，electron-builder 产物可生成）; 为每条 acceptance_criteria 收集可验证证据（截图/日志/manifest
    样例）; 运行 verification/ 下全部检查脚本并汇总报告
  capabilities:
  - 编写并运行 E2E 测试（启动应用/打开文件夹/编辑保存/对话/Agent/切换模型/模式热更新）
  - 运行 build 验证（npm run build 全仓无错误，electron-builder 产物可生成）
  - 为每条 acceptance_criteria 收集可验证证据（截图/日志/manifest 样例）
  - 运行 verification/ 下全部检查脚本并汇总报告
  tools:
  - name: 全部 packages 与 apps 产物
    access: read
  - name: task.yaml acceptance_criteria（7 条）
    access: read
  - name: E2E 测试套件与运行报告
    access: write
  - name: 每条 AC 的证据文件（evidence/AC1..AC7）
    access: write
  - name: 构建验证报告
    access: write
  scope:
    can_read:
    - 全部 packages 与 apps 产物
    - task.yaml acceptance_criteria（7 条）
    can_write:
    - E2E 测试套件与运行报告
    - 每条 AC 的证据文件（evidence/AC1..AC7）
    - 构建验证报告
    can_execute:
    - python orchestrator.py --verify
    - python guard.py --check
  boundaries:
    cannot:
    - 修改被测源码以让测试通过
    - 无证据标记 AC 完成（证据必须落盘 evidence/）
    - 性能测试占满 CPU/内存（task 软约束）
    max_context_lines: 600
    requires_human_review: false
  handoff:
    input_format:
    - 全部 packages 与 apps 产物
    - task.yaml acceptance_criteria（7 条）
    output_format:
    - E2E 测试套件与运行报告
    - 每条 AC 的证据文件（evidence/AC1..AC7）
    - 构建验证报告
  verification:
    self_check: Run verification before marking complete
    external_check: orchestrator.py --verify must pass
  assigned_workflows:
  - verification
  assigned_criteria:
  - 构建成功无错误，上述每条标准均有可验证证据
